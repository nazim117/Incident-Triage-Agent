# Nginx acting as a REVERSE PROXY in front of the Flask webapp.
#
# "Reverse proxy" means: clients only ever talk to Nginx. Nginx forwards
# (proxies) their requests to the real backend (the `webapp` container) and
# relays the response back. The client never talks to the app directly and,
# in this stack, can't even reach it - only Nginx's port is published to the
# host (see docker-compose.yml).
#
# Why bother, instead of just exposing the Flask app directly?
#   - Single, consistent entry point (host port 8080) no matter how many
#     backend services exist behind it, or how they change.
#   - Nginx is a battle-tested, high-performance layer for things Flask/
#     gunicorn does badly or not at all out of the box: serving static
#     files, TLS termination, connection buffering, rate limiting.
#   - It's a chokepoint for observability: every request that reaches the
#     stack passes through here, so Nginx's own access/error logs and
#     metrics (Phase 2) become a single place to look when investigating
#     an incident, before you even get to the app.
#   - Least exposure: the backend and database are simply unreachable from
#     outside the Docker network. Nothing to patch/attack directly.

upstream webapp_backend {
    # "webapp" here is NOT a hostname on the internet - it resolves via
    # Docker's built-in DNS because both `nginx` and `webapp` are on the
    # same custom Docker network defined in docker-compose.yml. Docker
    # gives every container on a user-defined network a DNS entry matching
    # its service name. This is why we don't hardcode an IP address: the
    # webapp container's IP can change across restarts, but its name
    # ("webapp") stays stable.
    server webapp:8000;
}

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://webapp_backend;

        # Without these headers, the Flask app would see every request as
        # coming FROM Nginx (127.0.0.1 / the Docker network IP), not from
        # the real client - because as far as plain TCP is concerned, Nginx
        # IS the client from the app's point of view. These headers carry
        # the original request's real info through, so the app (and its
        # logs) can see what actually happened.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # If the backend doesn't respond in time, fail relatively fast
        # rather than hanging the client's request indefinitely. Tuned
        # short on purpose for this learning stack so that "backend is
        # down" incidents (Phase 3 failure injection) surface quickly as a
        # 502/504 instead of a long hang.
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # Nginx's own health endpoint, used by its Docker HEALTHCHECK
    # (docker-compose.yml). Deliberately does NOT proxy to the backend -
    # this checks "is Nginx itself alive and configured", independent of
    # whether the webapp behind it is healthy. Mirrors the same
    # liveness-vs-dependency distinction used in the Flask app's
    # /health vs /db-check.
    # Connection/request counters for nginx-prometheus-exporter (Phase 2).
    # Reachable only inside triage-net since port 80 isn't published as-is,
    # but 8080 maps to it, so restrict to private ranges.
    location = /stub_status {
        access_log off;
        allow 172.16.0.0/12;
        allow 127.0.0.1;
        deny all;
        stub_status;
    }

    location /nginx-health {
        access_log off;
        return 200 "nginx ok\n";
        add_header Content-Type text/plain;
    }
}
