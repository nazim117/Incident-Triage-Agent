# These alerts are the incident triggers the Phase 4 agent will react to.
groups:
  - name: triage
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 15s
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.job }} is not being scraped successfully"

      - alert: WebappHigh5xxRate
        expr: |
          sum(rate(webapp_http_requests_total{status=~"5.."}[1m]))
            / clamp_min(sum(rate(webapp_http_requests_total[1m])), 0.001) > 0.1
        for: 30s
        labels: { severity: critical }
        annotations:
          summary: "More than 10% of webapp responses are 5xx"

      - alert: WebappHighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(webapp_http_request_duration_seconds_bucket[1m]))) > 1
        for: 30s
        labels: { severity: warning }
        annotations:
          summary: "webapp p95 latency above 1s"

      - alert: DatabaseDown
        expr: pg_up == 0
        for: 15s
        labels: { severity: critical }
        annotations:
          summary: "Postgres is unreachable from its exporter"

      - alert: DatabaseConnectionsSaturated
        expr: |
          sum(pg_stat_activity_count)
            / scalar(pg_settings_max_connections) > 0.8
        for: 30s
        labels: { severity: warning }
        annotations:
          summary: "Postgres is using over 80% of max_connections"

      # cAdvisor discovers containers via containerd (see its `command` in
      # docker-compose.yml), so `name` is the container ID rather than the
      # compose name - `image` is the human-readable identifier here.
      - alert: ContainerRestarting
        expr: changes(container_start_time_seconds{name=~".+"}[5m]) > 2
        labels: { severity: warning }
        annotations:
          summary: "Container {{ $labels.image }} ({{ $labels.name }}) restarted more than twice in 5m"
