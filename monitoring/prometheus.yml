# Scrapes every service's metrics on triage-net (Docker DNS names).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: webapp
    static_configs: [{ targets: ["webapp:8000"] }]
  - job_name: nginx
    static_configs: [{ targets: ["nginx-exporter:9113"] }]
  - job_name: postgres
    static_configs: [{ targets: ["postgres-exporter:9187"] }]
  - job_name: cadvisor
    static_configs: [{ targets: ["cadvisor:8080"] }]
